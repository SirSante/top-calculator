<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="calc-display"></div>
            <div class="calc-buttons">
                <button class="button" data-type="DIGIT">7</button>
                <button class="button" data-type="DIGIT">8</button>
                <button class="button" data-type="DIGIT">9</button>
                <button class="button operator" data-type="OPERATOR">/</button>
                <button class="button" data-type="DIGIT">4</button>
                <button class="button" data-type="DIGIT">5</button>
                <button class="button" data-type="DIGIT">6</button>
                <button class="button operator" data-type="OPERATOR">x</button>
                <button class="button" data-type="DIGIT">1</button>
                <button class="button" data-type="DIGIT">2</button>
                <button class="button" data-type="DIGIT">3</button>
                <button class="button operator" data-type="OPERATOR">-</button>
                <button class="button" data-type="DIGIT">0</button>
                <button class="button" data-type="EQUALS">=</button>
                <button class="button" data-type="CLEAR">Clear</button>
                <button class="button operator" data-type="OPERATOR">+</button>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
